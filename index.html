<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <nav class="navbar">
       <div class="navbar-left">
           <div class="nav-header"><h1>Movies</h1></div>
           <ul class="nav-menu">
               <li><a href="#">Home</a></li>
               <li><a href="#popular-movies">Popular Movies</a></li>
               <li><a href="#trending-movies">Trending Movies</a></li>
               <li><a href="#top-rated-movies">Top Rated Movies</a></li>
           </ul>
       </div>
       <div class="navbar-right">
           <div class="search-sp">
               <input type="text" id="search-input" class="search" placeholder="Search"> <i id="search-icon" class="icon fa fa-search"></i> 
           </div>
           <div class="user-menu">
               <div class="user-avatar">U</div>
           </div>
       </div>
    </nav>
    
    <section class="slider">
       <span class="header"> <h1 class="slider-header">The Best To Watch</h1> </span>
       <div id="carouselExampleCaptions" class="carousel slide">
  <div class="carousel-indicators">
  </div>
  <div id="carousel" class="carousel-inner">
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
</div>
    </section>

    <section id="popular-section"  class="movies-section">
        <h2 class="section-header">Popular Movies</h2>
        <div class="movies-grid" id="popular-movies">
         
        </div>
    </section>

    <section id="trending-section" class="movies-section">
        <h2 class="section-header">Trending Now</h2>
        <div class="movies-grid" id="trending-movies">
         
        </div>
    </section>

    <section id="top-rated-section" class="movies-section">
        <h2 class="section-header">Top Rated</h2>
        <div class="movies-grid" id="top-rated-movies">
         
        </div>
    </section>

    <section id="search-section" class="search-section movies-section">
        <h2 class="section-header">Search Results for <span id="search-query"></span></h2>
        <div class="search movies-grid" id="search-results">
         
        </div>
    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app/app.js"></script>
</body>
</html>
